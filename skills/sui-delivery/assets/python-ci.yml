name: Python quality checks
"on": [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install reviewed locked check dependencies
        run: python -m pip install --require-hashes -r requirements-checks.lock
      - name: Type check configured project
        run: python -m mypy .
      - name: Execute meaningful tests and record branch coverage
        run: python -m coverage run --branch -m pytest --junitxml=test-results.xml
      - name: Export coverage
        run: python -m coverage json -o coverage.json
